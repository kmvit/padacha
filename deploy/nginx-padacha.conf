# padacha.ru на сервере hackit (Jino VPS). Ставится в
# /etc/nginx/sites-available/padacha, включается симлинком.
#
# TLS снимает прокси Jino (195.161.41.70) — так же, как у hack-its.ru, —
# поэтому здесь только :80, а сертификат выпускается в панели Jino.
#
# Кто что отдаёт:
#   public/ (стили, картинки, robots.txt) — nginx;
#   html, sitemap.xml, приём заявок, админка — Django на 127.0.0.1:8120;
#   /api/assistant/ — ассистент на 127.0.0.1:8101 (8100 занят ассистентом hack-its);
#   /pult/, /api/license/ — пульт остался на сервере сервиса, проксируем туда.

server {
    listen 80;
    server_name padacha.ru www.padacha.ru;

    root /opt/padacha/public;

    # Настоящий адрес посетителя приходит от прокси Jino в X-Forwarded-For:
    # по нему считаются лимиты заявок и ассистента.
    set_real_ip_from 195.161.41.70;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # SEO: один адрес на страницу. www и /index.html — дубли, склеиваем 301.
    if ($host = www.padacha.ru) {
        return 301 https://padacha.ru$request_uri;
    }
    if ($request_uri ~ "^/index\.html(\?.*)?$") {
        return 301 /;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1000;

    # Django — страницы, статьи, sitemap.xml, заявки, админка
    location @site {
        proxy_pass http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # снаружи всегда https: его снимает прокси Jino
        proxy_set_header X-Forwarded-Proto https;
        # Не кэшируем html: правка в админке должна доезжать сразу.
        add_header Cache-Control "no-cache";
    }

    location = /api/lead/ {
        client_max_body_size 64k;
        try_files /nonexistent @site;
    }

    # Ассистент. Внешний путь /api/assistant/ХХХ -> внутренний /api/ХХХ у сервиса.
    location /api/assistant/ {
        proxy_pass http://127.0.0.1:8101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Пульт и лицензии — на сервере сервиса, под именем pult.padacha.ru.
    # Инстансы заведений по-прежнему ходят на https://padacha.ru/api/license/.
    # Имя через переменную и resolver: адрес ищется при запросе, а не при
    # старте nginx. Иначе без DNS-записи pult.padacha.ru не поднимется весь
    # nginx сервера — вместе с hack-its.ru.
    location ~ ^/(pult/|pult-static/|api/license/) {
        resolver 77.88.8.8 77.88.8.1 valid=300s;
        set $pult https://pult.padacha.ru;
        proxy_pass $pult;
        proxy_ssl_server_name on;
        proxy_set_header Host pult.padacha.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Статика админки сайта (collectstatic кладёт при старте юнита)
    location ^~ /admin-static/ {
        alias /opt/padacha/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Старые адреса вида /sklad/index.html — на /sklad/
    location ~ ^(.*/)index\.html$ {
        return 301 $1;
    }

    # Картинки и видео меняются редко — пусть браузер держит неделю.
    location ~* \.(webp|jpe?g|png|gif|ico|svg|mp4|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri @site;
    }

    # Файл в public/ есть — отдаём (nav.css, robots.txt …), нет — Django.
    location / {
        try_files $uri @site;
    }
}
